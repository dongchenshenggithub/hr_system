<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>HR 系统登录</title>
</head>
<body>
    <h1>登录</h1>
    <form id="login-form">
        <label>用户名 <input type="text" id="username" name="username" required></label><br><br>
        <label>密码 <input type="password" id="password" name="password" required></label><br><br>
        <label><input type="checkbox" id="remember-me"> 记住我</label><br><br>
        <button type="submit" id="login-btn">登录</button>
    </form>
    <p id="message"></p>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const message = document.getElementById('message');

            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password}),
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('token', data.access_token);
                window.location.href = '/employees';
            } else {
                message.textContent = '用户名或密码错误';
            }
        });
    </script>
</body>
</html>
